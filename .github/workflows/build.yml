name: Native build and tests
on:
  push:
    branches: [main]
    # Version tags run the full build and then publish a GitHub release (see the release job).
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: native-build-${{ github.event_name }}-${{ github.ref }}
  # Cancel outdated PR/main runs; tags and manual runs have separate groups and finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
permissions:
  contents: read
jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      build: ${{ steps.filter.outputs.build }}
      package: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Decide whether native builds are needed
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # Tags/manual runs always validate and package, including docs-only releases.
          # If the comparison is unavailable (e.g. a new branch), build conservatively.
          build=true
          if [[ "$EVENT_NAME" != workflow_dispatch && "$REF" != refs/tags/v* && -n "$BASE_SHA" && "$BASE_SHA" != 0000000000000000000000000000000000000000 ]]; then
            revisions=("$BASE_SHA" "$HEAD_SHA")
            if [[ "$EVENT_NAME" == pull_request ]]; then
              revisions=("$BASE_SHA...$HEAD_SHA")
            fi
            if git diff --name-only --no-renames -z "${revisions[@]}" > "$RUNNER_TEMP/changed-files"; then
              build=false
              while IFS= read -r -d '' path; do
                case "$path" in
                  README.md|CONTRIBUTING.md|docs/*.md|docs/*.png|docs/*.jpg|docs/*.jpeg|docs/*.svg|docs/*.gif|docs/*.webp|development/*.md) ;;
                  *) build=true; break ;;
                esac
              done < "$RUNNER_TEMP/changed-files"
            else
              echo 'Unable to compare revisions; running all native checks.'
            fi
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
  core:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    timeout-minutes: 10
    strategy:
      fail-fast: true
      matrix:
        os: [windows-2022, macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: cmake -S . -B build-core -DSAV_BUILD_APP=OFF
      - run: cmake --build build-core --config Release
      - run: ctest --test-dir build-core -C Release --output-on-failure --timeout 120
  tsan:
    name: core (ThreadSanitizer)
    needs: changes
    if: needs.changes.outputs.build == 'true'
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    env:
      TSAN_OPTIONS: halt_on_error=1 second_deadlock_stack=1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # TSan in Ubuntu 24.04's toolchain cannot map its shadow memory with the kernel's default 32-bit mmap ASLR entropy.
      - run: sudo sysctl -w vm.mmap_rnd_bits=28
      - run: cmake -S . -B build-tsan -DCMAKE_BUILD_TYPE=RelWithDebInfo -DSAV_BUILD_APP=OFF -DSAV_TSAN=ON
      - run: cmake --build build-tsan --parallel 4
      - run: ctest --test-dir build-tsan --output-on-failure --timeout 120
  macos:
    needs: [changes, core]
    if: needs.changes.outputs.build == 'true' && github.event_name != 'pull_request'
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: brew install qtbase ffmpeg rtaudio rtmidi libarchive pkgconf ninja
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$(brew --prefix)"
      - run: cmake --build build --parallel 4
      - run: ctest --test-dir build --output-on-failure --timeout 300
      - name: Bundle runtime dependencies and sign ad-hoc
        if: needs.changes.outputs.package == 'true'
        run: |
          mkdir -p dist artifacts
          cp -R build/simpleavshow.app dist/
          "$(brew --prefix qtbase)/bin/macdeployqt" dist/simpleavshow.app -always-overwrite
          plugins=$("$(brew --prefix qtbase)/bin/qtpaths" --query QT_INSTALL_PLUGINS)
          cp "$plugins/platforms/libqoffscreen.dylib" dist/simpleavshow.app/Contents/PlugIns/platforms/
          python3 packaging/bundle_macos.py dist/simpleavshow.app
          python3 packaging/collect_licenses.py macos dist/licenses
          cp packaging/README.txt README.md LICENSE dist/
          cp -R docs dist/
      - name: Verify the packaged macOS bundle version
        if: needs.changes.outputs.package == 'true'
        run: |
          version=$(sed -nE 's/^project\(SimpleAVShow VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)
          test -n "$version"
          for key in CFBundleShortVersionString CFBundleVersion; do
            actual=$(/usr/libexec/PlistBuddy -c "Print :$key" dist/simpleavshow.app/Contents/Info.plist)
            if [[ "$actual" != "$version" ]]; then
              echo "$key is '$actual'; expected project version '$version'." >&2
              exit 1
            fi
          done
      - name: Smoke test the packaged app
        if: needs.changes.outputs.package == 'true'
        run: QT_QPA_PLATFORM=offscreen dist/simpleavshow.app/Contents/MacOS/simpleavshow --demo --preview-time 6 --screenshot artifacts/editor.png
      - name: Archive
        if: needs.changes.outputs.package == 'true'
        run: ditto -c -k --sequesterRsrc dist artifacts/SimpleAVShow-macos-arm64.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: needs.changes.outputs.package == 'true'
        with:
          retention-days: 1
          name: macos-arm64-release
          path: artifacts/SimpleAVShow-macos-arm64.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: needs.changes.outputs.package == 'true'
        with:
          retention-days: 1
          name: macos-arm64-preview
          path: artifacts/editor.png
  linux:
    needs: [changes, core]
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: sudo apt-get update && sudo apt-get install -y qt6-base-dev libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libswscale-dev librtmidi-dev libasound2-dev libarchive-dev pkg-config ninja-build ffmpeg
      - name: Build RtAudio 6 (Ubuntu's packaged RtAudio is older)
        run: |
          # RtAudio 6.0.1, pinned by the tag's commit.
          git init -q /tmp/rtaudio
          git -C /tmp/rtaudio fetch -q --depth 1 https://github.com/thestk/rtaudio.git b4f04903312e0e0efffbe77655172e0f060dc085
          git -C /tmp/rtaudio checkout -q --detach FETCH_HEAD
          cmake -S /tmp/rtaudio -B /tmp/rtaudio-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DRTAUDIO_BUILD_TESTING=OFF -DRTAUDIO_API_PULSE=OFF -DRTAUDIO_API_JACK=OFF
          cmake --build /tmp/rtaudio-build
          sudo cmake --install /tmp/rtaudio-build
          sudo ldconfig
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel 4
      - run: ctest --test-dir build --output-on-failure --timeout 300
      - name: Build AppImage
        if: needs.changes.outputs.package == 'true'
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          QMAKE: /usr/bin/qmake6
          EXTRA_PLATFORM_PLUGINS: libqoffscreen.so
          LDAI_OUTPUT: SimpleAVShow-linux-x86_64.AppImage
        run: |
          mkdir -p artifacts AppDir/usr/share/simpleavshow
          curl -fL --retry 3 https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage -o /tmp/linuxdeploy-x86_64.AppImage
          curl -fL --retry 3 https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/1-alpha-20250213-1/linuxdeploy-plugin-qt-x86_64.AppImage -o /tmp/linuxdeploy-plugin-qt-x86_64.AppImage
          sha256sum -c - <<'EOF'
          c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d  /tmp/linuxdeploy-x86_64.AppImage
          15106be885c1c48a021198e7e1e9a48ce9d02a86dd0a1848f00bdbf3c1c92724  /tmp/linuxdeploy-plugin-qt-x86_64.AppImage
          EOF
          chmod +x /tmp/linuxdeploy*.AppImage
          cp packaging/README.txt README.md LICENSE AppDir/usr/share/simpleavshow/
          cp -R docs AppDir/usr/share/simpleavshow/
          cp assets/icon.svg /tmp/simpleavshow.svg
          # Deploy first so notices cover exactly the bundled libraries, then pack.
          /tmp/linuxdeploy-x86_64.AppImage --appdir AppDir --executable build/simpleavshow --desktop-file packaging/simpleavshow.desktop --icon-file /tmp/simpleavshow.svg --plugin qt
          python3 packaging/collect_licenses.py linux AppDir/usr/share/simpleavshow/licenses --appdir AppDir
          /tmp/linuxdeploy-x86_64.AppImage --appdir AppDir --output appimage
          mv SimpleAVShow-linux-x86_64.AppImage artifacts/
      - name: Smoke test the packaged app
        if: needs.changes.outputs.package == 'true'
        run: QT_QPA_PLATFORM=offscreen APPIMAGE_EXTRACT_AND_RUN=1 artifacts/SimpleAVShow-linux-x86_64.AppImage --demo --preview-time 6 --screenshot artifacts/editor.png
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: needs.changes.outputs.package == 'true'
        with:
          retention-days: 1
          name: linux-x86_64-release
          path: artifacts/SimpleAVShow-linux-x86_64.AppImage
          if-no-files-found: error
  windows:
    # Windows is the show platform: build/test code changes on PRs too; package on tags/manual runs.
    needs: [changes, core]
    if: needs.changes.outputs.build == 'true'
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg-cache,readwrite"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ffmpeg-sdk/ffmpeg-sdk.zip
          key: windows-ffmpeg-sdk-${{ hashFiles('packaging/ffmpeg-windows.json') }}
      - name: Download verified prebuilt FFmpeg shared SDK
        shell: pwsh
        run: |
          python packaging/fetch_ffmpeg_windows.py ffmpeg-sdk
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $pin = Get-Content packaging/ffmpeg-windows.json | ConvertFrom-Json
          "FFMPEG_ROOT=$pwd/ffmpeg-sdk/$($pin.directory)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: dependencies
        with:
          path: vcpkg-cache
          key: windows-vcpkg-noqt-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'ports/**') }}
          restore-keys: windows-vcpkg-noqt-
      - name: Fetch the pinned vcpkg revision
        shell: pwsh
        run: |
          $baseline = (Get-Content vcpkg.json | ConvertFrom-Json).'builtin-baseline'
          git -C $env:VCPKG_INSTALLATION_ROOT fetch origin $baseline
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C $env:VCPKG_INSTALLATION_ROOT checkout $baseline
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:VCPKG_INSTALLATION_ROOT/bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build RtAudio/RtMidi/libarchive and configure (prebuilt Qt and FFmpeg)
        shell: pwsh
        run: cmake -S . -B build -A x64 "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows -DVCPKG_MANIFEST_NO_DEFAULT_FEATURES=ON "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR" "-DSAV_FFMPEG_ROOT=$env:FFMPEG_ROOT"
      - name: Cache built dependencies before compiling the app
        if: steps.dependencies.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: vcpkg-cache
          key: windows-vcpkg-noqt-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'ports/**') }}
      - run: cmake --build build --config Release --parallel 4
      - name: Tests
        shell: pwsh
        run: |
          Copy-Item "$env:FFMPEG_ROOT/bin/*.dll" build/Release/
          $env:PATH = "$env:FFMPEG_ROOT/bin;$env:PATH"
          ctest --test-dir build -C Release --output-on-failure --timeout 300
      - run: cmake --install build --config Release --prefix "$pwd/dist"
        if: needs.changes.outputs.package == 'true'
      - name: Package and smoke test
        if: needs.changes.outputs.package == 'true'
        shell: pwsh
        run: |
          python packaging/collect_licenses.py windows dist/licenses --vcpkg build/vcpkg_installed/x64-windows --qt $env:QT_ROOT_DIR --ffmpeg $env:FFMPEG_ROOT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $platformPlugin = Get-ChildItem dist -Recurse -Filter qwindows.dll | Select-Object -First 1
          if (!$platformPlugin) { throw 'Qt Windows platform plugin was not deployed' }
          Copy-Item "$env:QT_ROOT_DIR/plugins/platforms/qoffscreen.dll" $platformPlugin.Directory.FullName
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vsPath = & $vswhere -latest -products '*' -property installationPath
          $runtime = Get-Item "$vsPath/VC/Redist/MSVC/*/x64/Microsoft.VC143.CRT" | Sort-Object FullName -Descending | Select-Object -First 1
          if (!$runtime) { throw 'MSVC runtime directory not found' }
          Copy-Item "$($runtime.FullName)/*.dll" dist/bin/
          Copy-Item packaging/README.txt,README.md,LICENSE dist/
          Copy-Item docs dist/ -Recurse
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $env:QT_QPA_PLATFORM = 'offscreen'
          Remove-Item Env:QT_PLUGIN_PATH -ErrorAction SilentlyContinue
          $env:PATH = "$env:SystemRoot/System32;$env:SystemRoot"
          $process = Start-Process dist/bin/simpleavshow.exe -ArgumentList '--demo','--preview-time','6','--screenshot',"$pwd/artifacts/editor.png" -Wait -PassThru
          if ($process.ExitCode -ne 0 -or !(Test-Path artifacts/editor.png)) { throw 'Packaged app smoke test failed' }
          Compress-Archive -Path dist/* -DestinationPath artifacts/SimpleAVShow-windows-x86_64.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: needs.changes.outputs.package == 'true'
        with:
          retention-days: 1
          name: windows-x86_64-release
          path: artifacts/SimpleAVShow-windows-x86_64.zip
          if-no-files-found: error
  ci:
    name: CI
    needs: [changes, core, tsan, linux, macos, windows]
    # A required check must fail when a dependency fails or is unexpectedly skipped.
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify required jobs passed
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          BUILD_REQUIRED: ${{ needs.changes.outputs.build }}
          CORE_RESULT: ${{ needs.core.result }}
          TSAN_RESULT: ${{ needs.tsan.result }}
          LINUX_RESULT: ${{ needs.linux.result }}
          MACOS_RESULT: ${{ needs.macos.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
        run: |
          echo "core=$CORE_RESULT tsan=$TSAN_RESULT linux=$LINUX_RESULT macos=$MACOS_RESULT windows=$WINDOWS_RESULT"
          if [[ "$CHANGES_RESULT" != success || ( "$BUILD_REQUIRED" != true && "$BUILD_REQUIRED" != false ) ]]; then
            echo 'Change classification must succeed and return a build decision.' >&2
            exit 1
          fi
          expected=success
          if [[ "$BUILD_REQUIRED" == false ]]; then
            expected=skipped
          fi
          for result in "$CORE_RESULT" "$TSAN_RESULT" "$LINUX_RESULT" "$WINDOWS_RESULT"; do
            if [[ "$result" != "$expected" ]]; then
              echo "Core, ThreadSanitizer, Linux, and Windows must report $expected." >&2
              exit 1
            fi
          done
          if [[ "$EVENT_NAME" == pull_request ]]; then
            expected=skipped
          fi
          if [[ "$MACOS_RESULT" != "$expected" ]]; then
            echo "The macOS job must report $expected for $EVENT_NAME." >&2
            exit 1
          fi
  release:
    name: Release
    # Runs only for version tags, after every build/test job (and the CI gate) succeeded.
    needs: ci
    timeout-minutes: 10
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Check the tag matches the project version
        run: |
          version=$(sed -nE 's/^project\(SimpleAVShow VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)
          # vX.Y.Z publishes that version; vX.Y.Z-suffix publishes a prerelease of it.
          if [[ "$GITHUB_REF_NAME" != "v$version" && "$GITHUB_REF_NAME" != "v$version-"* ]]; then
            echo "Tag $GITHUB_REF_NAME does not match the project version $version in CMakeLists.txt." >&2
            exit 1
          fi
          if ! grep -q "^SimpleAVShow $version " packaging/README.txt; then
            echo "packaging/README.txt does not name version $version." >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: '*-release'
          path: release
          merge-multiple: true
      - name: Add the source archive and checksums
        run: |
          for package in SimpleAVShow-macos-arm64.zip SimpleAVShow-windows-x86_64.zip SimpleAVShow-linux-x86_64.AppImage; do
            if [[ ! -s "release/$package" ]]; then echo "Missing release package $package." >&2; exit 1; fi
          done
          # GPL: every release carries the complete source of the tagged commit.
          git archive --format=tar.gz --prefix="SimpleAVShow-$VERSION/" -o "release/SimpleAVShow-$VERSION-source.tar.gz" HEAD
          (cd release && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          title="SimpleAVShow $VERSION"
          # 0.x versions and suffixed tags are development prereleases.
          if [[ "$VERSION" == 0.* || "$GITHUB_REF_NAME" == *-* ]]; then
            prerelease=(--prerelease)
            title="$title — development prerelease"
          fi
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            # A re-run refreshes the assets and notes of the existing release.
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
            gh release edit "$GITHUB_REF_NAME" --notes-file packaging/release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" release/* "${prerelease[@]}" --verify-tag --title "$title" --notes-file packaging/release-notes.md
          fi
